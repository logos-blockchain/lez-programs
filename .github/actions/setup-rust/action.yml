name: Set up Rust
description: Installs the pinned Rust toolchain and restores the cargo cache
inputs:
  cache-key:
    description: Cache namespace, one per job so parallel jobs don't overwrite each other's target dir
    required: true
  components:
    description: Extra rustup components
    default: ""
runs:
  using: "composite"
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.94.0"
        components: ${{ inputs.components }}

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ inputs.cache-key }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ inputs.cache-key }}-
          ${{ runner.os }}-cargo-
