name: Install Nix
description: Installs Nix with the logos-co binary cache
runs:
  using: "composite"
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://logos-co.cachix.org
          extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=
