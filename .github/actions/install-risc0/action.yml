name: Install risc0
description: Installs risc0 in the environment
runs:
  using: "composite"
  steps:
    - name: Install risc0
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        curl -L https://risczero.com/install | bash
        /home/runner/.risc0/bin/rzup install
        # The host SDK loads the r0vm executable matching risc0-zkvm in Cargo.lock.
        /home/runner/.risc0/bin/rzup install r0vm 3.0.5
      shell: bash

