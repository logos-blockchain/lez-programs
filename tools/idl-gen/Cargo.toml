[package]
name = "idl-gen"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[[bin]]
name = "idl-gen"
path = "src/main.rs"

[dependencies]
# The actor-model generator (IDL v2), on spel's refactor/lez-v0.4.x.
spel-framework-core = { git = "https://github.com/logos-co/spel.git", rev = "dbb6aec1822be3fe4cda65ccb331b92ccaeb321f", package = "spel-framework-core", features = ["idl-gen"] }
