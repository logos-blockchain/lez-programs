[package]
name = "token_mint_authority_core"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[features]
idl = ["dep:spel-attrs"]

[dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false }
spel-attrs = { workspace = true, optional = true }
