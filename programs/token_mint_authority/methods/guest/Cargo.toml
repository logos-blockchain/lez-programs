[package]
name = "token-mint-authority-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.release]
debug = 0
strip = "symbols"

[[bin]]
name = "token_mint_authority"
path = "src/bin/token_mint_authority.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", rev = "1ef0500f8fc8ce3ddf95523726ae159db83f744f", package = "spel-framework" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
token_mint_authority_core = { path = "../../core" }
token_mint_authority_program = { path = "../..", package = "token_mint_authority_program" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
