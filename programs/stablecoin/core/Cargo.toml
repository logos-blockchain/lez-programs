[package]
name = "stablecoin_core"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
# Not `workspace = true`: that would inherit the `host` feature into the guest build.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# Inert #[message] / #[state] markers that make idl-gen find the IDL's types; build time only.
spel-attrs = { git = "https://github.com/logos-co/spel.git", rev = "d7444f84cabee3371aca3bdee8ebc4c2fc45ebde" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
alloy-primitives = { version = "1", default-features = false }
# Pin ruint (transitive via alloy-primitives) below 1.18, which raised its MSRV to rustc 1.90.
# The risc0 guest toolchain ships rustc 1.88, so 1.18+ fails the guest build. 1.17.0 (MSRV 1.85)
# is the newest compatible release. Remove this pin once the risc0 toolchain advances past 1.90.
ruint = { version = "=1.17.0", default-features = false }
twap_oracle_core = { path = "../../twap_oracle/core" }
