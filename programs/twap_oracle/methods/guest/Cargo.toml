[package]
name = "twap-oracle-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.release]
debug = 0
strip = "symbols"

[[bin]]
name = "twap_oracle"
path = "src/bin/twap_oracle.rs"

[dependencies]
spel-framework = { git = "https://github.com/0x-r4bbit/spel.git", rev = "1ba0b6b797957875710c87837f4080d5341e98da", package = "spel-framework" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.5-rc2", package = "lee_core" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.5-rc2" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
twap_oracle_core = { path = "../../core" }
twap_oracle_program = { path = "../..", package = "twap_oracle_program" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"