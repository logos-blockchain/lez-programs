[package]
name = "integration_tests"
version = "0.1.0"
edition = "2021"
# Each program's test file returns as a target with its port to the actor model; until
# then it stays in tests/ unbuilt.
autotests = false

[lints]
workspace = true

[[test]]
name = "token"
path = "tests/token.rs"

[[test]]
name = "token_private"
path = "tests/token_private.rs"

[[test]]
name = "nft"
path = "tests/nft.rs"

[[test]]
name = "nft_private"
path = "tests/nft_private.rs"

[[test]]
name = "twap_oracle"
path = "tests/twap_oracle.rs"

[[test]]
name = "amm"
path = "tests/amm.rs"

[dependencies]
borsh = { workspace = true }
lee = { workspace = true }
lee_core = { workspace = true, features = ["host", "test_utils"] }
token_core = { workspace = true }
token-methods = { path = "../token/methods" }
nft_core = { workspace = true }
nft-methods = { path = "../nft/methods" }
twap_oracle_core = { workspace = true }
twap-oracle-methods = { path = "../twap_oracle/methods" }
integration-test-methods = { path = "methods" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3" }
# LEZ's system programs, prebuilt (`artifacts`): the tests deploy its clock.
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc3", features = ["artifacts"] }
amm_core = { workspace = true }
amm-methods = { path = "../amm/methods" }

[dev-dependencies]
amm_ffi = { path = "../../modules/amm/ffi" }
serde_json = { workspace = true }
hex = "0.4"
